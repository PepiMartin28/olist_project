              bronze_schema: ${var.bronze_schema}
              raw_olist_geolocation_table: ${var.raw_olist_geolocation_table}
              silver_schema: ${var.silver_schema}
              geolocation_table: ${var.geolocation_table}
        
        - task_key: order_items_silver
