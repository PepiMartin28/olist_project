resources:
  jobs:
    olist_silver_layer:
      name: Olist Silver Layer
      
      email_notifications:
        on_failure:
          - martinpepi_99@hotmail.com

      tasks:
        - task_key: silver_setup
          notebook_task:
            notebook_path: ../../src/silver/silver_setup.ipynb
            base_parameters:
              catalog: ${var.catalog}
              silver_schema: ${var.silver_schema}
        
        - task_key: customers_silver
          depends_on:
            - task_key: silver_setup
          notebook_task:
            notebook_path: ../../src/silver/customers_silver.ipynb
            base_parameters:
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              raw_olist_customers_table: ${var.raw_olist_customers_table}
              silver_schema: ${var.silver_schema}
              customers_table: ${var.customers_table}

        - task_key: geolocation_silver
          depends_on:
            - task_key: silver_setup
          notebook_task:
            notebook_path: ../../src/silver/geolocation_silver.ipynb
