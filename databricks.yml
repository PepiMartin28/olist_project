# This is a Databricks asset bundle definition for olist_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: olist_project
  uuid: 16f23f10-7df8-4b5c-964e-0cfa3e4798f4

include:
  - resources/*.yml
  - resources/**/*.yml

# Builds the olist_silver helper wheel and uploads it as a bundle artifact.
# The silver job's serverless environment installs it via `dist/*.whl`.
artifacts:
  olist_silver_wheel:
    type: whl
    build: uv build --wheel
    path: .