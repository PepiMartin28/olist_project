# This is a Databricks asset bundle definition for olist_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: olist_project
  uuid: 16f23f10-7df8-4b5c-964e-0cfa3e4798f4

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-73e4c67b-b212.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  
  prod:
    mode: production
    workspace:
      host: https://dbc-73e4c67b-b212.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/martinpepi_99@hotmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/martinpepi_99@hotmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: martinpepi_99@hotmail.com
        level: CAN_MANAGE
