version: 2

models:
  - name: fact_orders
    columns:
      - name: id
        tests: [not_null, unique]
      - name: fulfillmentStatus
        tests:
          - accepted_values:
              values:
                - created 
                - approved 
                - invoiced
                - processing
                - shipped
                - delivered
                - unavailable
                - canceled
      - name: avgReviewScore
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 5
      - name: purchaseDate
        tests: [not_null]
      # Forward durations: should never be negative. A negative value means the
      # source timestamps are out of order. Tested as `warn` (source anomalies we
      # surface but do not block on). deliveryDelayHours is intentionally NOT
      # tested here — it is legitimately negative for early deliveries.
      - name: processingHours
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              config:
                severity: warn
      - name: deliveryHours
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              config:
                severity: warn
      - name: courierHours
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              config:
                severity: warn
      - name: totalTimeHours
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              config:
                severity: warn
      - name: estimatedHours
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              config:
                severity: warn

  - name: fact_order_items
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - orderId
            - orderItemId
    columns:
      - name: orderId
        tests:
          - not_null
          - relationships:
              to: ref('fact_orders')
              field: id
      - name: orderItemId
        tests: [not_null]
      - name: productId
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: id
      - name: sellerId
        tests:
          - not_null
          - relationships:
              to: ref('dim_sellers')
              field: id
      - name: price
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
          - not_null
      - name: freightValue
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
          - not_null